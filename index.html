  }
  qPick.addEventListener("click", () => { renderPicker(); pickerEl.hidden = false; $("close-picker").focus(); });
  const closePicker = () => { pickerEl.hidden = true; qPick.focus(); };
  $("close-picker").addEventListener("click", closePicker);
  pickerEl.addEventListener("click", e => {
    if (e.target === pickerEl) { closePicker(); return; }
    const tb = e.target.closest("[data-test]");
    if (tb) { pickerEl.hidden = true; openTest(tb.dataset.test); return; }
    const b = e.target.closest("button[data-t]");
    if (!b || b.disabled) return;
    quizType = b.dataset.t;
    quizLevel = +b.dataset.l;
    saveSel();
    pickerEl.hidden = true;
    startSet();
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!pickerEl.hidden) closePicker();
    if (!testEl.hidden) $("test-cancel").click();
  });

  // ===== 正解の演出：花丸と打ち上げ花火 =====
  const celEl = $("celebrate"), fwCanvas = $("fw"), hanaSvg = $("hanamaru");
  let celReady = false, fwRaf = 0, fwTimers = [];

  function drawHanamaru(fast) {
    const f = fast ? 0.35 : 1;
    const c = 200;
    let sp = "";
    const turns = 2.6, steps = 150;
    for (let k = 0; k <= steps; k++) {
      const t = k / steps, a = -Math.PI / 2 + t * turns * Math.PI * 2, r = 10 + t * 88;
      sp += (k ? "L" : "M") + (c + r * Math.cos(a)).toFixed(1) + "," + (c + r * Math.sin(a)).toFixed(1);
    }
    const n = 12, R = 140, rr = R * Math.sin(Math.PI / n) * 1.12;
    let pd = "";
    for (let k = 0; k <= n; k++) {
      const a = -Math.PI / 2 + k * 2 * Math.PI / n;
      const x = (c + R * Math.cos(a)).toFixed(1), y = (c + R * Math.sin(a)).toFixed(1);
      pd += k ? `A${rr.toFixed(1)},${rr.toFixed(1)} 0 0 1 ${x},${y}` : `M${x},${y}`;
    }
    const line = 'fill="none" stroke="#ff3358" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"';
    hanaSvg.innerHTML =
      `<path id="hm-fill" d="${pd}Z" fill="#ffe3ea" opacity="0"/>` +
      `<path class="hm-line" d="${sp}" ${line}/>` +
      `<path class="hm-line" d="${pd}" ${line}/>`;
    if (!hanaSvg.animate) return;
    hanaSvg.animate([
      { transform: "scale(0.4) rotate(-25deg)", opacity: 0 },
      { transform: "scale(1.07) rotate(4deg)", opacity: 1, offset: 0.6 },
      { transform: "scale(1) rotate(0deg)", opacity: 1 }
    ], { duration: 600 * f, easing: "ease-out" });
    const lines = hanaSvg.querySelectorAll(".hm-line");
    lines.forEach((p, k) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: (k ? 750 : 600) * f, delay: (k ? 550 : 0) * f, easing: "ease-in-out", fill: "forwards" });
    });
    hanaSvg.querySelector("#hm-fill").animate([{ opacity: 0 }, { opacity: 0.95 }], { duration: 400 * f, delay: 1150 * f, fill: "forwards" });
  }

  const FW_COLORS = ["#ff4d6d", "#ffd23f", "#4dd0ff", "#a77bff", "#5cff9d", "#ff8a3d", "#ffffff", "#ff7ad9"];
  let boomBuf = null;
  function boomSound() {
    if (!soundOn || !actx) return;
    try {
      if (!boomBuf) {
        const len = Math.floor(actx.sampleRate * 0.7);
        boomBuf = actx.createBuffer(1, len, actx.sampleRate);
        const d = boomBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      }
      const t = actx.currentTime;
      const src = actx.createBufferSource(); src.buffer = boomBuf;
      const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500 + Math.random() * 400;
      const g = actx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
      src.connect(lp); lp.connect(g); g.connect(actx.destination);
      src.start(t); src.stop(t + 0.7);
      for (let k = 0; k < 5; k++) clack(t + 0.15 + Math.random() * 0.35, 0.12);   // パチパチ
    } catch (_) {}
  }
  function fanfare(big) {
    if (!soundOn || !actx) return;
    try {
      const notes = big ? [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5] : [523.25, 659.25, 783.99, 1046.5];
      const durs = big ? [0.12, 0.12, 0.12, 0.24, 0.12, 0.55] : [0.11, 0.11, 0.11, 0.45];
      let t = actx.currentTime + 0.05;
      notes.forEach((f, i) => {
        const o = actx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
        const g = actx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + durs[i] + 0.1);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + durs[i] + 0.12);
        t += durs[i];
      });
    } catch (_) {}
  }
  function stopFireworks() {
    cancelAnimationFrame(fwRaf);
    fwTimers.forEach(clearTimeout); fwTimers = [];
    const ctx = fwCanvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  }
  function fireworks(count) {
    stopFireworks();
    const ctx = fwCanvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const Wc = fwCanvas.clientWidth, Hc = fwCanvas.clientHeight;
    fwCanvas.width = Math.round(Wc * dpr); fwCanvas.height = Math.round(Hc * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sc = Math.max(0.6, Math.min(Wc, Hc) / 600);
    const rockets = [], parts = [];
    let pending = count;
    for (let k = 0; k < count; k++) {
      fwTimers.push(setTimeout(() => {
        pending--;
        const ty = Hc * (0.12 + Math.random() * 0.3);
        rockets.push({ x: Wc * (0.12 + Math.random() * 0.76), y: Hc + 10, ty, vy: -(Hc + 10 - ty) / 40, color: pick(FW_COLORS) });
      }, k * 280 + Math.random() * 150));
    }
    function explode(r) {
      const n = 60 + rand(40), c2 = pick(FW_COLORS);
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, s = (1.8 + Math.random() * 3.6) * sc * 1.3;
        parts.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: 1, decay: 0.011 + Math.random() * 0.012, color: Math.random() < 0.7 ? r.color : c2 });
      }
      boomSound();
    }
    const step = () => {
      ctx.clearRect(0, 0, Wc, Hc);
      ctx.lineCap = "round";
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.y += r.vy; r.vy *= 0.985;
        ctx.globalAlpha = 1;
        ctx.strokeStyle = r.color; ctx.lineWidth = 3 * sc;
        ctx.beginPath(); ctx.moveTo(r.x, r.y + 16 * sc); ctx.lineTo(r.x, r.y); ctx.stroke();
        if (r.y <= r.ty || r.vy > -1) { explode(r); rockets.splice(i, 1); }
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.px = p.x; p.py = p.y;
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.982; p.vy = p.vy * 0.982 + 0.055 * sc;
        p.life -= p.decay;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        ctx.globalAlpha = Math.min(1, p.life * 1.3);
        ctx.strokeStyle = p.color; ctx.lineWidth = 2.6 * sc;
        ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (pending > 0 || rockets.length || parts.length) fwRaf = requestAnimationFrame(step);
    };
    fwRaf = requestAnimationFrame(step);
  }

  // ===== シールとシールちょう =====
  const star5 = (cx, cy, R, r) => Array.from({ length: 10 }, (_, k) => {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r : R;
    return `${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`;
  }).join(" ");
  const STICKERS = [
    `<polygon points="${star5(50, 53, 42, 18)}" fill="#ffd23f" stroke="#f0a500" stroke-width="2"/>`,
    `<path d="M50 86C20 64 8 46 14 30C20 14 42 12 50 28C58 12 80 14 86 30C92 46 80 64 50 86Z" fill="#ff5c8a"/><ellipse cx="32" cy="32" rx="7" ry="4" fill="#ffffff" opacity=".7" transform="rotate(-30 32 32)"/>`,
    [0, 1, 2, 3, 4].map(k => { const a = -Math.PI / 2 + k * 2 * Math.PI / 5; return `<circle cx="${(50 + 22 * Math.cos(a)).toFixed(1)}" cy="${(50 + 22 * Math.sin(a)).toFixed(1)}" r="17" fill="#ffa8cf"/>`; }).join("") + `<circle cx="50" cy="50" r="13" fill="#ffd23f"/>`,
    `<path d="M50 52 Q56 74 66 88" fill="none" stroke="#2f8f46" stroke-width="5" stroke-linecap="round"/><circle cx="36" cy="36" r="16" fill="#4cc46a"/><circle cx="64" cy="36" r="16" fill="#4cc46a"/><circle cx="36" cy="62" r="16" fill="#4cc46a"/><circle cx="64" cy="62" r="16" fill="#4cc46a"/>`,
    `<path d="M14 74L20 30L36 52L50 22L64 52L80 30L86 74Z" fill="#ffcc33" stroke="#e0a100" stroke-width="2" stroke-linejoin="round"/><rect x="14" y="70" width="72" height="12" rx="3" fill="#f0b400"/><circle cx="50" cy="76" r="5" fill="#ff4d6d"/><circle cx="30" cy="76" r="4" fill="#4dd0ff"/><circle cx="70" cy="76" r="4" fill="#4dd0ff"/>`,
    `<path d="M50 30C50 18 60 12 70 12" fill="none" stroke="#2f8f46" stroke-width="4" stroke-linecap="round"/><path d="M50 30C44 44 36 52 34 56M50 30C56 44 62 50 66 54" fill="none" stroke="#2f8f46" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="68" r="16" fill="#e8262c"/><circle cx="66" cy="66" r="16" fill="#e8262c"/><circle cx="29" cy="62" r="4" fill="#ffffff" opacity=".7"/><circle cx="61" cy="60" r="4" fill="#ffffff" opacity=".7"/>`,
    `<path d="M12 72A38 38 0 0 1 88 72" fill="none" stroke="#ff4d4d" stroke-width="8"/><path d="M20 72A30 30 0 0 1 80 72" fill="none" stroke="#ffb13d" stroke-width="8"/><path d="M28 72A22 22 0 0 1 72 72" fill="none" stroke="#ffe14d" stroke-width="8"/><path d="M36 72A14 14 0 0 1 64 72" fill="none" stroke="#4dc4ff" stroke-width="8"/><circle cx="16" cy="74" r="9" fill="#ffffff" stroke="#d8e6f0" stroke-width="2"/><circle cx="84" cy="74" r="9" fill="#ffffff" stroke="#d8e6f0" stroke-width="2"/>`,
    `<path d="M60 12A38 38 0 1 0 88 66A30 30 0 1 1 60 12Z" fill="#ffd23f" stroke="#f0a500" stroke-width="2"/><polygon points="${star5(76, 26, 9, 4)}" fill="#fff3a6"/>`,
    // 8: しんきゅうテスト合格の メダル
    `<path d="M28 6L44 42L35 47L19 11Z" fill="#4d8bff"/><path d="M72 6L56 42L65 47L81 11Z" fill="#ff4d6d"/><circle cx="50" cy="62" r="30" fill="#ffcc33" stroke="#d9a400" stroke-width="3"/><circle cx="50" cy="62" r="21" fill="none" stroke="#fff3a6" stroke-width="2.5"/><polygon points="${star5(50, 63, 14, 6)}" fill="#fff3a6"/>`
  ];
  const MEDAL = 8;
  const stickerSVG = i => `<svg class="sticker" viewBox="0 0 100 100" aria-hidden="true"><g class="st-outline">${STICKERS[i]}</g>${STICKERS[i]}</svg>`;
  const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  function loadStickers() {
    try { const a = JSON.parse(localStorage.getItem("soroban-stickers") || "[]"); return Array.isArray(a) ? a : []; } catch (_) { return []; }
  }
  function awardSticker(medal) {
    const list = loadStickers();
    const s = medal ? MEDAL : rand(MEDAL);
    list.push({ d: dkey(new Date()), s });
    try { localStorage.setItem("soroban-stickers", JSON.stringify(list)); } catch (_) {}
    return { s, today: list.filter(x => x.d === dkey(new Date())).length };
  }

  const bookEl = $("book");
  let bookMonth = new Date(); bookMonth.setDate(1);
  function renderBook() {
    const list = loadStickers();
    const byDay = {};
    list.forEach(x => { (byDay[x.d] = byDay[x.d] || []).push(x.s); });
    const todayKey = dkey(new Date());
    const todayList = byDay[todayKey] || [];
    const tc = todayList.filter(s => s !== MEDAL).length, tm = todayList.length - tc;
    $("book-today").innerHTML = todayList.length
      ? `きょうは<b>${tc}</b>セット クリア！` + (tm ? `　メダル<b>${tm}</b>こ` : "")
      : "きょうのシールは まだないよ。もんだいモードで5もん とこう！";
    const y = bookMonth.getFullYear(), m = bookMonth.getMonth();
    $("m-label").textContent = `${y}ねん ${m + 1}がつ`;
    const now = new Date();
    $("m-next").disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());
    let html = ["にち", "げつ", "か", "すい", "もく", "きん", "ど"]
      .map((w, k) => `<div class="wd${k === 0 ? " sun" : k === 6 ? " sat" : ""}">${w}</div>`).join("");
    const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    for (let k = 0; k < first; k++) html += `<div class="day blank"></div>`;
    for (let d = 1; d <= days; d++) {
      const date = new Date(y, m, d), key = dkey(date), wd = date.getDay();
      const st = byDay[key] || [];
      const shown = st.slice(0, 4).map(stickerSVG).join("");
      const more = st.length > 4 ? `<span class="more">+${st.length - 4}</span>` : "";
      html += `<div class="day${wd === 0 ? " sun" : wd === 6 ? " sat" : ""}${key === todayKey ? " today" : ""}"><span class="n">${d}</span><span class="stk">${shown}${more}</span></div>`;
    }
    $("cal").innerHTML = html;
    $("book-total").textContent = `ぜんぶで ${list.length}まい`;
  }
  $("open-book").addEventListener("click", () => {
    bookMonth = new Date(); bookMonth.setDate(1);
    renderBook();
    bookEl.hidden = false;
    $("close-book").focus();
  });
  const closeBook = () => { bookEl.hidden = true; $("open-book").focus(); };
  $("close-book").addEventListener("click", closeBook);
  bookEl.addEventListener("click", e => { if (e.target === bookEl) closeBook(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !bookEl.hidden) closeBook(); });
  $("m-prev").addEventListener("click", () => { bookMonth.setMonth(bookMonth.getMonth() - 1); renderBook(); });
  $("m-next").addEventListener("click", () => { bookMonth.setMonth(bookMonth.getMonth() + 1); renderBook(); });

  // kind: q=1もん正解  set=5もんクリア  testq=テスト中の正解  pass=テスト合格
  let celKind = "q", celTimer = 0;
  function showSticker(s) {
    const stEl = $("cel-sticker");
    stEl.innerHTML = stickerSVG(s);
    stEl.hidden = false;
    if (stEl.animate) stEl.animate([
      { transform: "scale(0) rotate(-40deg)", opacity: 0 },
      { transform: "scale(1.25) rotate(10deg)", opacity: 1, offset: 0.6 },
      { transform: "scale(1) rotate(8deg)", opacity: 1 }
    ], { duration: 550, delay: 1400, easing: "ease-out", fill: "both" });
  }
  function celebrate(kind, note) {
    celKind = kind;
    $("cel-sticker").hidden = true;
    const tEl = $("cel-title"), sEl = $("cel-sub");
    if (kind === "set") {
      const got = awardSticker(false);
      tEl.textContent = `${SET_SIZE}もん クリア！`;
      sEl.textContent = `シールゲット！（きょう ${got.today}まいめ）　じかん ${fmtTimeJa(quiz.elapsed)}` +
        (note ? `\n${note}` : "") + "\nタップで もういちど";
      showSticker(got.s);
    } else if (kind === "pass") {
      const got = awardSticker(true);
      tEl.textContent = "ごうかく！";
      sEl.textContent = `${TYPE[quizType].name} レベル${quizLevel + 1}が ひらいたよ！\nメダルシールを ゲット！　じかん ${fmtTimeJa(quiz.elapsed)}\nタップで つぎのレベルへ`;
      showSticker(got.s);
    } else if (kind === "testq") {
      tEl.textContent = "せいかい！";
      sEl.textContent = `${quiz.count} / ${TEST_SIZE}もん`;
    } else {
      tEl.textContent = "せいかい！";
      sEl.textContent = "タップでつぎのもんだい";
    }
    celEl.hidden = false;
    celReady = false;
    drawHanamaru(kind === "testq");
    ensureAudio();
    fanfare(kind === "set" || kind === "pass");
    if (kind === "testq") {
      // テスト中は タップなしで すぐ つぎへ（このあいだ じかんは とまる）
      clearTimeout(celTimer);
      celTimer = setTimeout(() => {
        celEl.hidden = true;
        if (mode === "quiz" && quiz.test) newQuestion();
      }, 950);
      return;
    }
    setTimeout(() => { celReady = true; }, 700);
    if (!REDUCED) fireworks(kind === "pass" ? 22 : kind === "set" ? 14 : 7);
  }
  celEl.addEventListener("pointerup", () => {
    if (!celReady || celKind === "testq") return;
    celEl.hidden = true;
    stopFireworks();
    if (celKind === "pass") {
      quizLevel = Math.min(5, quizLevel + 1);
      saveSel();
      startSet();
    } else if (quiz.finished) startSet();
    else newQuestion();
  });

  build();
  if (mode === "quiz") applyMode();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
