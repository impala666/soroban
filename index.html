<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b84d75">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>こどもそろばん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
/* Layout: one-screen landscape tool — slim header with digit steppers, soroban fills the rest, digits under each rod */
:root {
  --bg: #fdf1f5;
  --fg: #3a2530;
  --muted: #8a6676;
  --plate: #fffafc;
  --plate-line: #f2d3df;
  --btn: #d6457a;
  --btn-fg: #ffffff;
  --step: #f7d9e4;
  --step-fg: #6b2c47;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #22181d; --fg: #f7e6ee; --muted: #b892a4; --plate: #2e2127; --plate-line: #46323b;
    --btn: #ff7aa8; --btn-fg: #22181d; --step: #46323b; --step-fg: #f7e6ee; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #22181d; --fg: #f7e6ee; --muted: #b892a4; --plate: #2e2127; --plate-line: #46323b;
  --btn: #ff7aa8; --btn-fg: #22181d; --step: #46323b; --step-fg: #f7e6ee; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
header {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px;
  padding-block: 4px 8px;
}
h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.08em; flex: 1; min-width: 0; }
h1 small { font-size: 0.75rem; font-weight: 500; color: var(--muted); margin-left: 0.6em; letter-spacing: 0.02em; }
.steppers { display: flex; gap: 16px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .name { font-size: 0.9rem; color: var(--muted); margin-right: 2px; }
.stepper output { font: 700 1.15rem var(--font); min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button {
  font: 700 1.3rem/1 var(--font); width: 44px; height: 44px; border-radius: 50%;
  border: 0; background: var(--step); color: var(--step-fg); cursor: pointer;
}
.stepper button:disabled { opacity: 0.35; cursor: default; }
.stepper button:not(:disabled):active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
button#reset {
  font: 700 1.1rem var(--font); letter-spacing: 0.1em;
  background: var(--btn); color: var(--btn-fg);
  border: 0; border-radius: 999px; padding: 10px 26px; cursor: pointer;
}
button#reset:active { transform: translateY(1px); filter: brightness(0.95); }
.pill {
  font: 700 1rem var(--font); letter-spacing: 0.08em;
  background: var(--step); color: var(--step-fg);
  border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
}
.pill:active { transform: translateY(1px); }

/* 設定画面 */
.overlay {
  position: fixed; inset: 0; z-index: 20; box-sizing: border-box;
  background: rgba(60, 18, 38, 0.45);
  display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
           max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  background: var(--plate); color: var(--fg); box-sizing: border-box;
  width: min(600px, 100%); max-height: 100%; overflow: auto;
  border-radius: 20px; padding: 16px 22px 18px;
  box-shadow: 0 14px 40px rgba(80, 16, 46, 0.3);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; }
.sheet h2 { margin: 0; font-size: 1.3rem; letter-spacing: 0.12em; }
.set-row {
  display: grid; grid-template-columns: 6.5em minmax(0, 1fr); align-items: center; gap: 6px 14px;
  padding-block: 12px; border-top: 1px solid var(--plate-line);
}
.set-row h3 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button {
  font: 700 1rem var(--font); min-width: 3.6em; padding: 9px 16px; cursor: pointer;
  border-radius: 999px; border: 2px solid var(--step); background: transparent; color: var(--fg);
}
.seg button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
.seg .dot {
  display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -2px;
  border: 1px solid rgba(0, 0, 0, 0.25);
}
.note { grid-column: 2; margin: 0; font-size: 0.8rem; color: var(--muted); }
.howto ul { margin: 0; padding-left: 1.2em; line-height: 1.75; font-size: 0.92rem; }
@media (max-width: 460px) {
  .set-row { grid-template-columns: minmax(0, 1fr); }
  .note { grid-column: 1; }
}
main { flex: 1; min-height: 0; display: flex; gap: 16px; align-items: stretch; }
.board { flex: 3 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
svg#abacus { width: 100%; flex: 1 1 0; min-height: 0; touch-action: none; display: block; }
#abacus.hide-answer .answer { visibility: hidden; }

/* 問題モード */
/* 問題の枠：そろばんの左にたて長で置く */
.q-panel {
  flex: 0 0 clamp(170px, 24vw, 290px); min-width: 0; min-height: 0; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px; padding: 12px;
  background: var(--plate); border: 2px solid var(--plate-line); border-radius: 18px;
}
.q-pick {
  font: 700 0.95rem/1.25 var(--font); background: var(--btn); color: var(--btn-fg);
  border: 0; border-radius: 14px; padding: 9px 12px; cursor: pointer;
}
.q-pick::after { content: " \25BE"; }
.q-meta {
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums;
}
#q-time.warn { color: #d6455a; font-weight: 700; }
.q-number {
  flex: 1; min-height: 0; overflow: hidden; border-top: 1px solid var(--plate-line); padding-top: 6px;
  display: flex; align-items: center; justify-content: center;
  font: 700 clamp(1.8rem, 9vh, 3.2rem)/1.2 var(--font); font-variant-numeric: tabular-nums; color: var(--fg);
}
/* 本と同じ たて書き（たす数は記号なし、ひく数は −） */
.mitori { display: inline-grid; justify-items: end; }
.mt-row { white-space: nowrap; }
.mt-line { justify-self: stretch; border-top: 0.07em solid var(--fg); margin-top: 0.12em; }
.ans-box {
  justify-self: stretch; min-width: 1.6em; min-height: 1.25em; margin-top: 0.22em; padding-inline: 0.15em;
  border: 2px solid var(--btn); border-radius: 0.2em; text-align: right; color: var(--btn); white-space: nowrap;
}
.q-col { display: flex; flex-direction: column; align-items: center; gap: 0.25em; }
.q-expr { white-space: nowrap; }
.q-eq { display: flex; align-items: center; gap: 0.25em; white-space: nowrap; }
.q-eq .ans-box { margin-top: 0; min-width: 2.2em; }

/* もんだいを えらぶ */
.picker-sheet { width: min(860px, 100%); }
.p-row {
  display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 13em; align-items: center; gap: 8px 12px;
  padding-block: 10px; border-top: 1px solid var(--plate-line);
}
.p-name { font-weight: 700; font-size: 1.02rem; }
.p-levels { display: flex; flex-wrap: wrap; gap: 6px; }
.p-levels button {
  font: 700 0.95rem var(--font); min-width: 3.6em; padding: 8px 10px; cursor: pointer;
  border-radius: 12px; border: 2px solid var(--step); background: transparent; color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center; gap: 3px;
}
.p-levels button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
.p-levels button:disabled { cursor: default; color: var(--muted); border-style: dashed; }
.p-status { font-size: 0.85rem; color: var(--muted); min-width: 0; }
.prog { display: flex; align-items: center; gap: 8px; }
.prog .bar { flex: 1; min-width: 3em; height: 8px; border-radius: 99px; background: var(--step); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--btn); }
.test-btn {
  font: 700 0.92rem var(--font); background: #ffcc33; color: #4a3300; cursor: pointer;
  border: 0; border-radius: 12px; padding: 9px 12px; box-shadow: 0 2px 0 #d9a400;
}
.done { font-weight: 700; color: var(--btn); }
@media (max-width: 700px) { .p-row { grid-template-columns: minmax(0, 1fr); } }

/* しんきゅうテスト */
.test-sheet { width: min(500px, 100%); text-align: center; }
.test-sheet h2 { margin: 4px 0 0; font-size: 1.5rem; letter-spacing: 0.12em; }
.test-msg { white-space: pre-line; font-size: 1.12rem; line-height: 1.75; margin: 10px 0 18px; }
.test-actions { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
.big-btn {
  font: 700 1.2rem var(--font); letter-spacing: 0.08em; background: var(--btn); color: var(--btn-fg);
  border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer;
}
.celebrate {
  position: fixed; inset: 0; z-index: 30; cursor: pointer;
  background: rgba(24, 12, 34, 0.74);
  display: flex; align-items: center; justify-content: center;
}
#fw { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cel-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; text-align: center; padding-inline: 16px; }
#hanamaru { width: min(84vw, 64vh); height: min(84vw, 64vh); overflow: visible; }
.cel-title { margin: 0; font: 700 clamp(2rem, 7vh, 3.4rem)/1.2 var(--font); color: #ffffff; letter-spacing: 0.12em; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45); }
.cel-sub { margin: 0; font: 500 1.1rem/1.6 var(--font); color: #ffffff; opacity: 0.95; white-space: pre-line; }
.hm-wrap { position: relative; }
#cel-sticker { position: absolute; right: -8%; bottom: -4%; width: 40%; aspect-ratio: 1; }
#cel-sticker svg { width: 100%; height: 100%; }

/* シール */
.sticker { filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.3)); overflow: visible; }
.st-outline * { fill: #ffffff !important; stroke: #ffffff !important; stroke-width: 12px !important; stroke-linejoin: round !important; }

/* シールちょう */
.book-sheet { width: min(760px, 100%); }
.book-today { margin: 2px 0 10px; font-size: 1.15rem; font-weight: 700; }
.book-today b { color: var(--btn); font-size: 1.6rem; margin-inline: 0.15em; }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 8px; }
.month-nav button {
  width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--step); color: var(--step-fg); font: 700 1.2rem/1 var(--font);
}
.month-nav button:disabled { opacity: 0.35; cursor: default; }
.month-nav .m { font: 700 1.15rem var(--font); min-width: 8em; text-align: center; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { text-align: center; font-size: 0.8rem; color: var(--muted); padding-block: 2px; }
.cal .sun, .cal .day.sun .n { color: #d6455a; }
.cal .sat, .cal .day.sat .n { color: #3a7bd5; }
.cal .day {
  min-height: 54px; min-width: 0; box-sizing: border-box; border-radius: 10px; padding: 3px 4px;
  background: var(--bg); display: flex; flex-direction: column; gap: 2px;
}
.cal .day.today { outline: 3px solid var(--btn); outline-offset: -3px; }
.cal .day .n { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal .day .stk { display: flex; flex-wrap: wrap; align-items: center; gap: 1px; }
.cal .day .stk svg { width: 22px; height: 22px; }
.cal .day .more { font-size: 0.75rem; font-weight: 700; color: var(--fg); }
.cal .blank { background: transparent; }
.book-total { margin: 10px 0 0; text-align: right; color: var(--muted); font-size: 0.9rem; }
.viz {
  flex: 2 1 0; min-width: 0; min-height: 0; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px; padding: 10px;
  background: var(--plate); border: 1px solid var(--plate-line); border-radius: 16px;
}
#viz-wrap { flex: 1; min-height: 0; position: relative; }
#viz-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 4px; border: 1px solid rgba(0,0,0,0.12); }
#pie-box { display: inline-flex; align-items: center; gap: 4px; }
#pie-canvas { width: 28px; height: 28px; }
@media (max-aspect-ratio: 1/1) { main { flex-direction: column; } }
.bead { transition: transform 110ms cubic-bezier(.3,.7,.4,1); }
.label { fill: var(--muted); font: 500 20px var(--font); }
.digit { fill: var(--fg); font: 700 58px var(--font); font-variant-numeric: tabular-nums; }
.plate { fill: var(--plate); stroke: var(--plate-line); stroke-width: 2; }
.reading { fill: var(--fg); font: 500 30px var(--font); letter-spacing: 0.04em; }
@media (prefers-reduced-motion: reduce) { .bead { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>そろばん</h1>
  <button id="open-book" class="pill" type="button">シール</button>
  <button id="open-settings" class="pill" type="button">設定</button>
  <button id="reset" type="button">御破算</button>
</header>

<div id="celebrate" class="celebrate" hidden>
  <canvas id="fw"></canvas>
  <div class="cel-inner">
    <div class="hm-wrap">
      <svg id="hanamaru" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <div id="cel-sticker" hidden></div>
    </div>
    <p class="cel-title" id="cel-title">せいかい！</p>
    <p class="cel-sub" id="cel-sub">タップでつぎのもんだい</p>
  </div>
</div>

<div id="book" class="overlay" hidden>
  <div class="sheet book-sheet" role="dialog" aria-modal="true" aria-labelledby="book-title">
    <div class="sheet-head">
      <h2 id="book-title">シールちょう</h2>
      <button id="close-book" class="pill" type="button">とじる</button>
    </div>
    <p class="book-today" id="book-today"></p>
    <div class="month-nav">
      <button id="m-prev" type="button" aria-label="まえのつき">‹</button>
      <span class="m" id="m-label"></span>
      <button id="m-next" type="button" aria-label="つぎのつき">›</button>
    </div>
    <div class="cal" id="cal"></div>
    <p class="book-total" id="book-total"></p>
  </div>
</div>

<div id="picker" class="overlay" hidden>
  <div class="sheet picker-sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="sheet-head">
      <h2 id="picker-title">もんだいを えらぶ</h2>
      <button id="close-picker" class="pill" type="button">とじる</button>
    </div>
    <div id="picker-list"></div>
  </div>
</div>

<div id="test" class="overlay" hidden>
  <div class="sheet test-sheet" role="dialog" aria-modal="true" aria-labelledby="test-title">
    <h2 id="test-title">しんきゅうテスト</h2>
    <p class="test-msg" id="test-msg"></p>
    <div class="test-actions">
      <button id="test-go" class="big-btn" type="button">スタート</button>
      <button id="test-cancel" class="pill" type="button">やめる</button>
    </div>
  </div>
</div>

<div id="settings" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title">設定</h2>
      <button id="close-settings" class="pill" type="button">とじる</button>
    </div>
    <section class="set-row">
      <h3>モード</h3>
      <div class="seg" id="seg-mode" role="group" aria-label="モード">
        <button type="button" data-v="basic">きほん</button>
        <button type="button" data-v="quiz">もんだい</button>
      </div>
    </section>
    <section class="set-row">
      <h3>レベルのロック</h3>
      <div class="seg" id="seg-lock" role="group" aria-label="レベルのロック">
        <button type="button" data-v="on">あり</button>
        <button type="button" data-v="off">なし</button>
      </div>
      <p class="note">「なし」にすると、テストに合格しなくても すべてのレベルを選べます（おとな用）</p>
    </section>
    <section class="set-row">
      <h3>桁数</h3>
      <div class="steppers">
        <div class="stepper" aria-label="整数の桁数">
          <span class="name">整数</span>
          <button id="int-minus" type="button" aria-label="整数の桁をへらす">−</button>
          <output id="int-out">4桁</output>
          <button id="int-plus" type="button" aria-label="整数の桁をふやす">＋</button>
        </div>
        <div class="stepper" aria-label="小数の桁数">
          <span class="name">小数</span>
          <button id="dec-minus" type="button" aria-label="小数の桁をへらす">−</button>
          <output id="dec-out">1桁</output>
          <button id="dec-plus" type="button" aria-label="小数の桁をふやす">＋</button>
        </div>
      </div>
    </section>
    <section class="set-row">
      <h3>音</h3>
      <div class="seg" id="seg-sound" role="group" aria-label="音">
        <button type="button" data-v="on">あり</button>
        <button type="button" data-v="off">なし</button>
      </div>
    </section>
    <section class="set-row">
      <h3>キラキラ</h3>
      <div class="seg" id="seg-sparkle" role="group" aria-label="キラキラ">
        <button type="button" data-v="big">大</button>
        <button type="button" data-v="mid">中</button>
        <button type="button" data-v="small">小</button>
        <button type="button" data-v="off">オフ</button>
      </div>
    </section>
    <section class="set-row">
      <h3>色合い</h3>
      <div class="seg" id="seg-color" role="group" aria-label="色合い"></div>
    </section>
    <section class="set-row howto">
      <h3>あそびかた</h3>
      <ul>
        <li>玉をタップするか、上下にはじいて動かす</li>
        <li>はりを横に3けた以上なぞると御破算</li>
        <li>もんだいモードでは、左上のボタンで しゅるいと レベルを えらぶ</li>
        <li>5もんで シール1まい。おなじレベルで シール10まいになると しんきゅうテスト</li>
      </ul>
    </section>
  </div>
</div>
<main>
  <aside class="q-panel" id="quiz-bar" aria-label="もんだい" hidden>
    <button id="q-pick" class="q-pick" type="button">かずをおく</button>
    <div class="q-meta"><span id="q-count">1 / 5もん</span><span id="q-time">0:00</span></div>
    <div class="q-number" id="q-number" aria-live="polite"></div>
  </aside>
  <div class="board">
    <svg id="abacus" role="img" aria-label="そろばん 0" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <section class="viz" id="viz" aria-label="数を赤丸で表示">
    <div id="viz-wrap"><canvas id="viz-canvas"></canvas></div>
    <div class="legend" id="legend"></div>
  </section>
</main>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const INT_MIN = 1, INT_MAX = 9, DEC_MIN = 0, DEC_MAX = 3;
  const INT_NAMES = ["一", "十", "百", "千", "万", "十万", "百万", "千万", "億"];
  const DEC_NAMES = ["0.1", "0.01", "0.001"];

  const S = 130;                  // rod spacing
  const FX = 30;                  // frame side thickness
  const FT = 30;                  // frame top/bottom thickness
  const H = 46;                   // bead height
  const BW = 112;                 // bead width
  const LABEL_H = 46;
  const T0 = LABEL_H + FT;        // heaven area top (inner)
  const B0 = T0 + 2 * H;          // beam top
  const BEAM = 16;
  const B1 = B0 + BEAM;           // earth area top (beam bottom)
  const F1 = B1 + 5 * H;          // earth area bottom (inner)
  const DIGIT_Y = F1 + FT + 18;
  const READ_Y = DIGIT_Y + 76 + 42;
  const VH = READ_Y + 14;

  // ===== 色合い =====
  // wood:枠 inner:内側 rod:軸 beam:はり dot:定位点 bead:一玉 beadH:五玉（省略時は一玉と同じ）

      dark: { bg: "#1d1826", fg: "#efe6ff", muted: "#a796c2", plate: "#2a2236", line: "#3e3350", btn: "#b48cf0", btnFg: "#1d1826", step: "#3e3350", stepFg: "#efe6ff" } },

      bead: ["#7a7085", "#3a3340", "#28222d", "#0d0b0f"], edge: "#000000",

      bead: ["#ff9a8c", "#e8382e", "#d0261d", "#9c140e"], edge: "#6e0d09",

      light: { bg: "#fbf1ef", fg: "#2d1b1a", muted: "#8a5f5b", plate: "#fffaf9", line: "#f1d6d2", btn: "#d8261d", btnFg: "#ffffff", step: "#f6dcd8", stepFg: "#8c1a13" },
      dark: { bg: "#201514", fg: "#fbe9e6", muted: "#c0938e", plate: "#2d1e1c", line: "#45302d", btn: "#ff5a4f", btnFg: "#201514", step: "#45302d", stepFg: "#fbe9e6" } },
    police: { label: "パトカー", sw: "linear-gradient(#ffffff 50%, #111111 50%)",
      wood: ["#2a2c30", "#0f1012"], inner: "#ffffff", rod: ["#a8adb3", "#eceff2"], beam: "#111111", beamA: "#e8262c", dot: "#ffffff",
      bead: ["#ffffff", "#f2f2f2", "#1d1d1f", "#000000"], edge: "#000000",
      beadH: ["#ff8a8a", "#e8262c", "#cc1a20", "#8f0f14"],
      light: { bg: "#f0f1f3", fg: "#18191b", muted: "#63666c", plate: "#ffffff", line: "#d9dbdf", btn: "#e8262c", btnFg: "#ffffff", step: "#e1e3e6", stepFg: "#18191b" },
      dark: { bg: "#121315", fg: "#eef0f2", muted: "#9a9ea6", plate: "#1d1f22", line: "#33363b", btn: "#ff4d52", btnFg: "#121315", step: "#33363b", stepFg: "#eef0f2" } },
    standard: { label: "スタンダード", sw: "#c98a4b",
      wood: ["#6b4428", "#4a2d19"], inner: "#f6ecd9", rod: ["#8e7a55", "#e6d6a8"], beam: "#3b2414", beamA: "#6a4226", dot: "#f6ecd9",
      bead: ["#e8b77a", "#c98a4b", "#a96c35", "#7e4c22"], edge: "#5c3616",
      light: { bg: "#f3efe7", fg: "#2e2620", muted: "#7a6d62", plate: "#fffdf8", line: "#e2d8ca", btn: "#9c3d2b", btnFg: "#fff8f2", step: "#e6dccd", stepFg: "#4a3a2e" },
      dark: { bg: "#1d1916", fg: "#f1e8de", muted: "#a8998b", plate: "#2a2420", line: "#3d3530", btn: "#c4593f", btnFg: "#1d1916", step: "#3a322c", stepFg: "#f1e8de" } }
  };
  let colorKey = "pink";
  try { const ck = localStorage.getItem("soroban-color"); if (THEMES[ck]) colorKey = ck; } catch (_) {}
  let BEAM_FILL, BEAM_ACTIVE;
  const themeStyle = document.createElement("style");
  document.head.appendChild(themeStyle);
  function applyTheme() {
    const t = THEMES[colorKey];
    BEAM_FILL = t.beam; BEAM_ACTIVE = t.beamA;
    const vars = p => `--bg:${p.bg};--fg:${p.fg};--muted:${p.muted};--plate:${p.plate};--plate-line:${p.line};--btn:${p.btn};--btn-fg:${p.btnFg};--step:${p.step};--step-fg:${p.stepFg};`;
    themeStyle.textContent =
      `:root{${vars(t.light)}}` +
      `@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${vars(t.dark)}color-scheme:dark}}` +
      `:root[data-theme="dark"]{${vars(t.dark)}color-scheme:dark}`;
  }
  applyTheme();

  const svg = document.getElementById("abacus");

  // 桁設定（前回の設定を覚えておく）
  let intDigits = 4, decDigits = 1;
  let curInt = 4, curDec = 1;     // いま盤にある桁（計算問題では自動でふえる）
  try {
    const saved = JSON.parse(localStorage.getItem("soroban-digits") || "null");
    if (saved) {
      intDigits = Math.min(INT_MAX, Math.max(INT_MIN, saved.i | 0));
      decDigits = Math.min(DEC_MAX, Math.max(DEC_MIN, saved.d | 0));
    }
  } catch (_) {}

  // 位ごとの玉の状態（キー: 一の位=0, 十の位=1, 0.1の位=-1 …）
  const values = new Map();
  const getVal = place => {
    if (!values.has(place)) values.set(place, { h: 0, n: 0 });
    return values.get(place);
  };

  // 現在の盤面
  let RODS, places, W, beamEl, heavenEls, earthEls, digitEls, readingEl, sparkLayer;

  // キラキラ
  const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STAR = "M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z";
  const SPARK_COLORS = ["#ffffff", "#fff3a6", "#ffe27a", "#ff7eb3", "#ffc1dc", "#d9b8ff", "#a8e4ff"];
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  let activeSparks = 0;
  let SPARK_LIMIT = 180;
  let sparkleLevel = "mid";        // big / mid / small / off
  try {
    const sv = localStorage.getItem("soroban-sparkle");
    if (["big", "mid", "small", "off"].includes(sv)) sparkleLevel = sv;
  } catch (_) {}
  // 小：星がふわっと浮かぶだけ
  function sparkleSmall(x, y) {
    for (let k = 0; k < 4; k++) {
      const p = k < 3
        ? el("path", { d: STAR, fill: pick(["#ffffff", "#fff3a6", "#ffd1e3", "#ffe27a"]), stroke: "#f48fb4", "stroke-width": 0.8 }, sparkLayer)
        : el("circle", { r: 3.5, fill: "#ffffff" }, sparkLayer);
      const px = x + (Math.random() - 0.5) * BW * 0.95, py = y + (Math.random() - 0.5) * H * 0.9;
      const s = 0.55 + Math.random() * 0.6, rot = (Math.random() < 0.5 ? -1 : 1) * (90 + Math.random() * 90);
      animateSpark(p, [
        { transform: `translate(${px}px, ${py}px) scale(0) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${px}px, ${py - 6}px) scale(${s}) rotate(${rot / 2}deg)`, opacity: 1, offset: 0.4 },
        { transform: `translate(${px}px, ${py - 16}px) scale(0.1) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 520 + Math.random() * 260, delay: 40 + Math.random() * 90, easing: "ease-out" });
    }
  }
  function animateSpark(p, frames, opts) {
    activeSparks++;
    const a = p.animate(frames, Object.assign({ easing: "cubic-bezier(.2,.7,.3,1)", fill: "both" }, opts));
    a.onfinish = a.oncancel = () => { p.remove(); activeSparks--; };
  }
  function sparkle(x, y) {
    if (REDUCED || !sparkLayer || sparkleLevel === "off") return;
    SPARK_LIMIT = sparkleLevel === "big" ? 320 : 180;
    if (activeSparks > SPARK_LIMIT || !sparkLayer.animate) return;
    if (sparkleLevel === "small") { sparkleSmall(x, y); return; }
    const big = sparkleLevel === "big";

    // 光の輪（ぱっと広がる）
    const ring = el("ellipse", { rx: BW * 0.42, ry: H * 0.62, fill: "none", stroke: "#ffffff", "stroke-width": big ? 7 : 5 }, sparkLayer);
    animateSpark(ring, [
      { transform: `translate(${x}px, ${y}px) scale(0.4)`, opacity: 0.95 },
      { transform: `translate(${x}px, ${y}px) scale(${big ? 2.3 : 1.7})`, opacity: 0 }
    ], { duration: big ? 650 : 520 });
    if (big) {
      const ring2 = el("ellipse", { rx: BW * 0.42, ry: H * 0.62, fill: "none", stroke: "#ff7eb3", "stroke-width": 4 }, sparkLayer);
      animateSpark(ring2, [
        { transform: `translate(${x}px, ${y}px) scale(0.3)`, opacity: 0.9 },
        { transform: `translate(${x}px, ${y}px) scale(2.7)`, opacity: 0 }
      ], { duration: 760, delay: 90 });
    }
    const flash = el("circle", { r: big ? 36 : 26, fill: "#fff6fa" }, sparkLayer);
    animateSpark(flash, [
      { transform: `translate(${x}px, ${y}px) scale(0.2)`, opacity: 0.9 },
      { transform: `translate(${x}px, ${y}px) scale(1.4)`, opacity: 0 }
    ], { duration: big ? 420 : 360 });

    // 飛び散る星と光の粒
    const total = big ? 18 : 11, stars = big ? 12 : 7;
    for (let k = 0; k < total; k++) {
      const star = k < stars;
      const col = pick(SPARK_COLORS);
      const p = star
        ? el("path", { d: STAR, fill: col, stroke: "#ff5c9d", "stroke-width": 0.9 }, sparkLayer)
        : el("circle", { r: 3 + Math.random() * 3, fill: col }, sparkLayer);
      const ang = Math.random() * Math.PI * 2;
      const dist = big ? 60 + Math.random() * 100 : 40 + Math.random() * 70;
      const sx = x + Math.cos(ang) * 10, sy = y + Math.sin(ang) * 6;
      const mx = x + Math.cos(ang) * dist * 0.6, my = y + Math.sin(ang) * dist * 0.45 - 8;
      const ex = x + Math.cos(ang) * dist, ey = y + Math.sin(ang) * dist * 0.7 - 22;
      const s = star ? (big ? 1.1 + Math.random() * 1.3 : 0.9 + Math.random() * 1.0) : (big ? 1.4 : 1);
      const rot = (Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 180);
      animateSpark(p, [
        { transform: `translate(${sx}px, ${sy}px) scale(0) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${mx}px, ${my}px) scale(${s}) rotate(${rot * 0.4}deg)`, opacity: 1, offset: 0.35 },
        { transform: `translate(${(mx + ex) / 2}px, ${(my + ey) / 2}px) scale(${s * 0.8}) rotate(${rot * 0.7}deg)`, opacity: 0.55, offset: 0.6 },
        { transform: `translate(${(mx + ex) / 2 + 2}px, ${(my + ey) / 2 - 3}px) scale(${s * 0.9}) rotate(${rot * 0.8}deg)`, opacity: 1, offset: 0.72 },
        { transform: `translate(${ex}px, ${ey}px) scale(0.1) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: (big ? 900 : 700) + Math.random() * (big ? 550 : 400), delay: 20 + Math.random() * (big ? 180 : 120) });
    }
  }
  function moveBead(g, top, i) {
    const moved = g._top !== undefined && g._top !== top;
    if (moved) sparkle(cx(i), top + H / 2);
    g._top = top;
    g.style.transform = `translateY(${top}px)`;
    return moved;
  }

  // 「パチッ」という音（その場で合成）
  let soundOn = true;
  try { soundOn = localStorage.getItem("soroban-sound") !== "off"; } catch (_) {}
  let actx = null, noiseBuf = null;
  function ensureAudio() {
    if (!soundOn) return;
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
        const len = Math.floor(actx.sampleRate * 0.05);
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      if (actx.state === "suspended") actx.resume();
    } catch (_) {}
  }
  function clack(t, vol) {
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = actx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2400 + Math.random() * 900; bp.Q.value = 3;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    src.start(t); src.stop(t + 0.06);
    const o = actx.createOscillator();
    o.type = "triangle";
    o.frequency.setValueAtTime(1500 + Math.random() * 200, t);
    o.frequency.exponentialRampToValueAtTime(900, t + 0.03);
    const og = actx.createGain();
    og.gain.setValueAtTime(vol * 0.35, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    o.connect(og); og.connect(actx.destination);
    o.start(t); o.stop(t + 0.05);
  }
  function playClack(rods) {
    if (!soundOn || !actx) return;
    try {
      const t0 = actx.currentTime + 0.07;          // 玉が当たるころに鳴らす
      const n = Math.min(rods, 8);
      for (let k = 0; k < n; k++) clack(t0 + k * 0.022 + Math.random() * 0.008, k === 0 ? 0.9 : 0.6);
    } catch (_) {}
  }

  // 数の読み方（ひらがな）
  const R_D = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
  const R_SEN = ["", "せん", "にせん", "さんぜん", "よんせん", "ごせん", "ろくせん", "ななせん", "はっせん", "きゅうせん"];
  const R_HYAKU = ["", "ひゃく", "にひゃく", "さんびゃく", "よんひゃく", "ごひゃく", "ろっぴゃく", "ななひゃく", "はっぴゃく", "きゅうひゃく"];
  const R_JU = ["", "じゅう", "にじゅう", "さんじゅう", "よんじゅう", "ごじゅう", "ろくじゅう", "ななじゅう", "はちじゅう", "きゅうじゅう"];
  const read4 = (n, beforeUnit) => {
    const t = Math.floor(n / 1000), h = Math.floor(n / 100) % 10, j = Math.floor(n / 10) % 10, o = n % 10;
    return (beforeUnit && t === 1 ? "いっせん" : R_SEN[t]) + R_HYAKU[h] + R_JU[j] + R_D[o];
  };
  function readNumber(N, decs) {
    let s;
    if (N === 0) s = "れい";
    else {
      const oku = Math.floor(N / 1e8), man = Math.floor(N / 1e4) % 1e4, rest = N % 1e4;
      s = (oku ? read4(oku, true) + "おく" : "") + (man ? read4(man, true) + "まん" : "") + read4(rest, false);
    }
    const d = decs.slice();
    while (d.length && d[d.length - 1] === 0) d.pop();   // 末尾の0は読まない
    if (d.length) s += "　てん　" + d.map(x => (x === 0 ? "れい" : R_D[x])).join("");
    return s;
  }

  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const cx = i => FX + S * i + S / 2;
  const heavenTop = h => (h ? B0 - H : T0);
  const earthTop = (bi, n) => (bi < n ? B1 + bi * H : B1 + (bi + 1) * H);
  const beadPath = c => {
    const l = c - BW / 2, r = c + BW / 2, m = H / 2, k = 30;
    return `M${l},${m} L${c - k},2 L${c + k},2 L${r},${m} L${c + k},${H - 2} L${c - k},${H - 2} Z`;
  };

  function build() {
    // 範囲外になった位の値は捨てる
    const bs = boardSize();
    curInt = bs.i; curDec = bs.d;
    for (const p of [...values.keys()]) if (p >= curInt || p < -curDec) values.delete(p);

    places = [];
    for (let p = curInt - 1; p >= 0; p--) places.push(p);
    for (let d = 1; d <= curDec; d++) places.push(-d);
    RODS = places.length;
    W = FX * 2 + S * RODS;

    svg.textContent = "";
    svg.setAttribute("viewBox", `0 0 ${W} ${VH}`);
    const T = THEMES[colorKey];

    const defs = el("defs", {}, svg);
    const wood = el("linearGradient", { id: "wood", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el("stop", { offset: "0", "stop-color": T.wood[0] }, wood);
    el("stop", { offset: "1", "stop-color": T.wood[1] }, wood);
    const beadGrad = (id, c) => {
      const g = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      ["0", "0.48", "0.52", "1"].forEach((o, k) => el("stop", { offset: o, "stop-color": c[k] }, g));
    };
    beadGrad("bead", T.bead);
    beadGrad("beadH", T.beadH || T.bead);
    const rodG = el("linearGradient", { id: "rod", x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
    el("stop", { offset: "0", "stop-color": T.rod[0] }, rodG);
    el("stop", { offset: "0.5", "stop-color": T.rod[1] }, rodG);
    el("stop", { offset: "1", "stop-color": T.rod[0] }, rodG);

    // 位の名前
    places.forEach((p, i) => {
      const t = el("text", { x: cx(i), y: LABEL_H - 14, "text-anchor": "middle", class: "label" }, svg);
      t.textContent = p >= 0 ? INT_NAMES[p] : DEC_NAMES[-p - 1];
    });

    // 枠
    el("rect", { x: 0, y: LABEL_H, width: W, height: F1 + FT - LABEL_H, rx: 14, fill: "url(#wood)" }, svg);
    el("rect", { x: FX, y: T0, width: S * RODS, height: F1 - T0, fill: T.inner }, svg);
    for (let i = 0; i < RODS; i++) {
      el("rect", { x: cx(i) - 4, y: T0, width: 8, height: F1 - T0, fill: "url(#rod)" }, svg);
    }

    // はりと定位点（一の位から3桁ごと）
    beamEl = el("rect", { x: FX - 4, y: B0, width: S * RODS + 8, height: BEAM, fill: BEAM_FILL }, svg);
    beamEl.style.transition = "fill 120ms";
    places.forEach((p, i) => {
      if (p >= 0 && p % 3 === 0) el("circle", { cx: cx(i), cy: B0 + BEAM / 2, r: 4, fill: T.dot }, svg);
    });

    // 玉
    const makeBead = (i, heaven) => {
      const g = el("g", { class: "bead" }, svg);
      el("path", { d: beadPath(cx(i)), fill: heaven ? "url(#beadH)" : "url(#bead)", stroke: T.edge, "stroke-width": 1.5, "stroke-linejoin": "round" }, g);
      el("rect", { x: cx(i) - 5, y: 0, width: 10, height: H, fill: T.edge, opacity: 0.3 }, g);
      g.style.transition = "none";
      return g;
    };
    heavenEls = []; earthEls = [];
    for (let i = 0; i < RODS; i++) {
      heavenEls.push(makeBead(i, true));
      earthEls.push([0, 1, 2, 3].map(() => makeBead(i)));
    }

    // 数字表示
    el("rect", { x: FX, y: DIGIT_Y, width: S * RODS, height: 76, rx: 14, class: "plate answer" }, svg);
    digitEls = places.map((_, i) =>
      el("text", { x: cx(i), y: DIGIT_Y + 60, "text-anchor": "middle", class: "digit answer" }, svg));
    if (curDec > 0) {
      const dot = el("text", { x: FX + S * curInt, y: DIGIT_Y + 60, "text-anchor": "middle", class: "digit answer" }, svg);
      dot.textContent = ".";
    }
    readingEl = el("text", { x: FX + S * RODS / 2, y: READ_Y, "text-anchor": "middle", class: "reading answer" }, svg);
    sparkLayer = el("g", { "pointer-events": "none" }, svg);
    activeSparks = 0;

    swipes.clear();
    render();
    requestAnimationFrame(() => requestAnimationFrame(() =>
      svg.querySelectorAll(".bead").forEach(g => (g.style.transition = ""))));
    updateControls();
  }

  function render() {
    const v = [];
    let movedRods = 0;
    places.forEach((p, i) => {
      const s = getVal(p);
      let m = moveBead(heavenEls[i], heavenTop(s.h), i);
      earthEls[i].forEach((g, bi) => { if (moveBead(g, earthTop(bi, s.n), i)) m = true; });
      if (m) movedRods++;
      const d = s.h * 5 + s.n;
      digitEls[i].textContent = d;
      v.push(d);
    });
    const label = v.slice(0, curInt).join("") + (curDec ? "." + v.slice(curInt).join("") : "");
    svg.setAttribute("aria-label", `そろばん ${label}`);
    let N = 0;
    places.forEach((p, i) => { if (p >= 0) N += v[i] * 10 ** p; });
    const tenth = curDec ? v[curInt] : 0;
    // 計算問題に正解したあとは、答えの読み方を出す
    const showAns = mode === "quiz" && quiz.solved && !quiz.failed && quiz.q && quiz.q.op !== "put";
    readingEl.textContent = showAns ? readNumber(quiz.q.answer, []) : readNumber(N, v.slice(curInt));
    readingEl.removeAttribute("textLength");
    const maxW = S * RODS - 24;
    try {
      if (readingEl.getComputedTextLength() > maxW) {
        readingEl.setAttribute("textLength", maxW);
        readingEl.setAttribute("lengthAdjust", "spacingAndGlyphs");
      }
    } catch (_) {}
    drawViz(N, tenth);
    if (movedRods) playClack(movedRods);
    svg.classList.toggle("hide-answer", mode === "quiz" && !quiz.solved);
    checkQuiz();
  }

  function toLocal(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function resetAll() {
    ensureAudio();
    values.clear();
    render();
  }

  // ===== 操作：タップ／上下スワイプ／はりを横になぞると御破算 =====
  const BEAM_TOL = 10;
  const SWIPE_TH = H * 0.35;     // これ以上上下に動けばスワイプ
  const swipes = new Map();       // pointerId -> {start, beam, minRod, maxRod, done}
  const rodAt = x => Math.max(0, Math.min(RODS - 1, Math.floor((x - FX) / S)));

  svg.addEventListener("pointerdown", e => {
    ensureAudio();
    const p = toLocal(e);
    if (p.x < FX || p.x > FX + S * RODS) return;
    if (p.y < T0 - FT || p.y > F1 + FT) return;
    const r = rodAt(p.x);
    const beam = p.y >= B0 - BEAM_TOL && p.y <= B1 + BEAM_TOL;
    swipes.set(e.pointerId, { start: p, beam, minRod: r, maxRod: r, done: false });
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    if (beam) beamEl.setAttribute("fill", BEAM_ACTIVE);
    e.preventDefault();
  });

  svg.addEventListener("pointermove", e => {
    const g = swipes.get(e.pointerId);
    if (!g || g.done) return;
    const p = toLocal(e);
    const dx = p.x - g.start.x, dy = p.y - g.start.y;
    if (g.beam) {
      const r = rodAt(p.x);
      g.minRod = Math.min(g.minRod, r);
      g.maxRod = Math.max(g.maxRod, r);
      if (g.maxRod - g.minRod + 1 >= 3) { g.done = true; resetAll(); return; }
    }
    if (Math.abs(dy) >= SWIPE_TH && Math.abs(dy) > Math.abs(dx)) {
      g.done = true;
      applySwipe(g.start, dy < 0 ? -1 : 1);
    } else if (!g.beam && Math.abs(dx) > S * 0.6) {
      g.done = true;               // 横にずれただけの操作は無視
    }
  });

  const endSwipe = e => {
    const g = swipes.get(e.pointerId);
    if (!g) return;
    swipes.delete(e.pointerId);
    if (![...swipes.values()].some(x => x.beam)) beamEl.setAttribute("fill", BEAM_FILL);
    if (e.type !== "pointerup" || g.done) return;
    // ほとんど動いていなければタップとして扱う
    const p = toLocal(e);
    if (Math.abs(p.x - g.start.x) < S / 2 && Math.abs(p.y - g.start.y) < SWIPE_TH) applyTap(g.start);
  };
  svg.addEventListener("pointerup", endSwipe);
  svg.addEventListener("pointercancel", endSwipe);

  // スワイプ：起点の玉を、指を動かした向きへ弾く
  function applySwipe(p, dir) {
    const i = Math.floor((p.x - FX) / S);
    if (i < 0 || i >= RODS) return;
    const s = getVal(places[i]);
    if (p.y < B0 + BEAM / 2) {
      // 五玉：下へ→入れる、上へ→払う
      s.h = dir > 0 ? 1 : 0;
    } else {
      // 触った一玉（隙間ならいちばん近い玉）
      let idx = 0, best = Infinity;
      for (let bi = 0; bi < 4; bi++) {
        const top = earthTop(bi, s.n);
        const d = p.y < top ? top - p.y : p.y > top + H ? p.y - top - H : 0;
        if (d < best) { best = d; idx = bi; }
      }
      if (dir < 0) s.n = Math.max(s.n, idx + 1);   // 上へ：その玉と上の玉をはりへ
      else s.n = Math.min(s.n, idx);              // 下へ：その玉と下の玉を下枠へ
    }
    render();
  }

  function applyTap(p) {
    const i = Math.floor((p.x - FX) / S);
    if (i < 0 || i >= RODS) return false;
    const s = getVal(places[i]);
    if (p.y >= T0 - FT && p.y <= B0) {
      // 5玉: 上半分→はりへ（5を入れる）、下半分→上枠へ（5を払う）
      s.h = p.y < (T0 + B0) / 2 ? 1 : 0;
    } else if (p.y >= B1 && p.y <= F1 + FT) {   // 下端の玉のために下枠まで反応させる
      // 一玉: タップ位置より上にある玉ははりへ、下にある玉は下枠へ
      let k = 0;
      for (let bi = 0; bi < 4; bi++) if (earthTop(bi, s.n) + H / 2 < p.y) k++;
      s.n = k;
    } else return false;
    render();
    return true;
  }

  // 桁の増減
  const $ = id => document.getElementById(id);
  function updateControls() {
    $("int-out").textContent = `${intDigits}桁`;
    $("dec-out").textContent = `${decDigits}桁`;
    $("int-minus").disabled = intDigits <= INT_MIN;
    $("int-plus").disabled = intDigits >= INT_MAX;
    $("dec-minus").disabled = decDigits <= DEC_MIN;
    $("dec-plus").disabled = decDigits >= DEC_MAX;
    try { localStorage.setItem("soroban-digits", JSON.stringify({ i: intDigits, d: decDigits })); } catch (_) {}
  }
  const change = (which, delta) => () => {
    if (which === "int") intDigits = Math.min(INT_MAX, Math.max(INT_MIN, intDigits + delta));
    else decDigits = Math.min(DEC_MAX, Math.max(DEC_MIN, decDigits + delta));
    if (mode === "quiz" && quizType === "put" && !quiz.test) startSet();
    else { if (mode === "quiz") values.clear(); build(); }
  };
  $("int-minus").addEventListener("click", change("int", -1));
  $("int-plus").addEventListener("click", change("int", +1));
  $("dec-minus").addEventListener("click", change("dec", -1));
  $("dec-plus").addEventListener("click", change("dec", +1));
  $("reset").addEventListener("click", resetAll);

  // 設定画面
  const settingsEl = $("settings");
  const openSettings = () => { settingsEl.hidden = false; $("close-settings").focus(); };
  const closeSettings = () => { settingsEl.hidden = true; $("open-settings").focus(); };
  $("open-settings").addEventListener("click", openSettings);
  $("close-settings").addEventListener("click", closeSettings);
  settingsEl.addEventListener("click", e => { if (e.target === settingsEl) closeSettings(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !settingsEl.hidden) closeSettings(); });

  function bindSeg(id, get, set) {
    const seg = $(id);
    const sync = () => seg.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.v === get() ? "true" : "false"));
    seg.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      set(b.dataset.v);
      sync();
    });
    sync();
    return sync;
  }
  bindSeg("seg-sound", () => (soundOn ? "on" : "off"), v => {
    soundOn = v === "on";
    try { localStorage.setItem("soroban-sound", soundOn ? "on" : "off"); } catch (_) {}
    if (soundOn) { ensureAudio(); playClack(1); }
  });
  bindSeg("seg-sparkle", () => sparkleLevel, v => {
    sparkleLevel = v;
    try { localStorage.setItem("soroban-sparkle", v); } catch (_) {}
  });
  $("seg-color").innerHTML = Object.entries(THEMES).map(([k, t]) =>
    `<button type="button" data-v="${k}"><span class="dot" style="background:${t.sw}"></span>${t.label}</button>`).join("");
  bindSeg("seg-color", () => colorKey, v => {
    if (!THEMES[v]) return;
    colorKey = v;
    try { localStorage.setItem("soroban-color", v); } catch (_) {}
    applyTheme();
    build();
  });

  // ===== 赤丸ビジュアル =====
  const vizWrap = $("viz-wrap"), vizCanvas = $("viz-canvas"), legendEl = $("legend");
  const RED = "#e0362f", RED_EDGE = "#a8231e";
  // 0:5のまとまり 1:10 2:100 3:1000 …
  const LEVEL_COLORS = ["#ffe27a", "#ffbfd2", "#d8c4f2", "#b9e0f5", "#c6ebbd", "#f6cfa6", "#c3cdee", "#ece39c", "#e3c0dc", "#cfe9e4"];
  const LEVEL_NAMES = ["5", "10", "100", "1000", "1万", "10万", "100万", "1000万", "1億", "10億"];
  let lastN = 0, lastTenth = 0;

  const sizeOf = n => {
    n.w = n.cols * n.child.w + (n.cols - 1) * n.gap + 2 * n.pad;
    n.h = n.rows * n.child.h + (n.rows - 1) * n.gap + 2 * n.pad;
    return n;
  };
  // 入れ物（レベルL = 10^L個分）の形を作る。内側は正方形寄り、一番外はパネルの形に合わせる
  function buildTree(L, cw, ch) {
    const DOT = { dot: true, cap: 1, w: 1, h: 1 };
    const five = sizeOf({ cap: 5, cols: 5, rows: 1, child: DOT, pad: 0.1, gap: 0, color: LEVEL_COLORS[0] });
    let node = sizeOf({ cap: 10, cols: 1, rows: 2, child: five, pad: 0.14, gap: 0.1, color: LEVEL_COLORS[1] });
    for (let k = 2; k <= L; k++) {
      const child = node, g = 0.14 * Math.min(child.w, child.h);
      const opts = [[5, 2], [2, 5]].map(([cols, rows]) =>
        sizeOf({ cap: child.cap * 10, cols, rows, child, gap: g, pad: g * 0.8, color: LEVEL_COLORS[k] }));
      if (k < L) node = opts.sort((a, b) => Math.abs(Math.log(a.w / a.h)) - Math.abs(Math.log(b.w / b.h)))[0];
      else node = opts.sort((a, b) => Math.min(cw / b.w, ch / b.h) - Math.min(cw / a.w, ch / a.h))[0];
    }
    return node;
  }

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  function drawNode(ctx, n, x, y, count, u, ring) {
    if (n.dot) {
      ctx.beginPath();
      ctx.arc(x + u / 2, y + u / 2, u * 0.38, 0, Math.PI * 2);
      if (count >= 1) {
        ctx.fillStyle = RED; ctx.fill();
        if (u >= 10) { ctx.lineWidth = Math.max(1, u * 0.04); ctx.strokeStyle = RED_EDGE; ctx.stroke(); }
      } else if (u >= 6) {
        ctx.lineWidth = Math.max(1, u * 0.04); ctx.strokeStyle = ring; ctx.stroke();
      }
      return;
    }
    if (count <= 0 && u < 6) return;
    const full = count >= n.cap;
    if (full) {
      rr(ctx, x, y, n.w * u, n.h * u, Math.max(2, n.pad * u * 1.2));
      ctx.fillStyle = n.color; ctx.fill();
      if (Math.min(n.child.w, n.child.h) * u < 3) {
        // 小さすぎて玉が描けないときは、中を赤で塗りつぶす
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = RED;
        ctx.fillRect(x + n.pad * u, y + n.pad * u, (n.w - 2 * n.pad) * u, (n.h - 2 * n.pad) * u);
        ctx.globalAlpha = 1;
        return;
      }
    }
    const c = n.child;
    for (let i = 0; i < n.cols * n.rows; i++) {
      const col = i % n.cols, row = Math.floor(i / n.cols);
      const cnt = Math.max(0, Math.min(c.cap, count - i * c.cap));
      drawNode(ctx, c, x + (n.pad + col * (c.w + n.gap)) * u, y + (n.pad + row * (c.h + n.gap)) * u, cnt, u, ring);
    }
  }

  function slotXY(n, idx, x, y, u) {
    if (n.dot) return [x + u / 2, y + u / 2];
    const c = n.child, i = Math.floor(idx / c.cap);
    const col = i % n.cols, row = Math.floor(i / n.cols);
    return slotXY(c, idx - i * c.cap, x + (n.pad + col * (c.w + n.gap)) * u, y + (n.pad + row * (c.h + n.gap)) * u, u);
  }

  // 0.1の位：丸を10分割し、36°ずつ赤くする
  function drawPie(ctx, cx, cy, r, tenth) {
    ctx.lineWidth = Math.max(1, r * 0.06);
    ctx.strokeStyle = "rgba(168,35,30,0.35)";
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + tenth * Math.PI / 5);
    ctx.closePath();
    ctx.fillStyle = RED; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = RED_EDGE; ctx.stroke();
  }

  function drawViz(N, tenth) {
    lastN = N; lastTenth = tenth;
    const need = N + (tenth > 0 ? 1 : 0);
    let L = 1;
    while (10 ** L < need) L++;

    const cw = vizWrap.clientWidth, ch = vizWrap.clientHeight;
    if (cw > 0 && ch > 0) {
      const dpr = window.devicePixelRatio || 1;
      vizCanvas.width = Math.round(cw * dpr);
      vizCanvas.height = Math.round(ch * dpr);
      const ctx = vizCanvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      const m = 4;
      const tree = buildTree(L, cw - 2 * m, ch - 2 * m);
      const u = Math.min((cw - 2 * m) / tree.w, (ch - 2 * m) / tree.h);
      const x0 = (cw - tree.w * u) / 2, y0 = (ch - tree.h * u) / 2;
      const ring = (getComputedStyle(document.documentElement).getPropertyValue("--plate-line") || "#ddd").trim();
      drawNode(ctx, tree, x0, y0, N, u, ring);
      if (tenth > 0) {
        const [px, py] = slotXY(tree, N, x0, y0, u);
        drawPie(ctx, px, py, u * 0.38, tenth);
      }
      // 凡例（玉が小さいときは0.1の位の丸を拡大表示）
      let html = "";
      for (let k = 0; k <= Math.max(1, L); k++) {
        html += `<span><span class="sw" style="background:${LEVEL_COLORS[k]}"></span>${LEVEL_NAMES[k]}</span>`;
      }
      if (tenth > 0 && u < 24) html += `<span id="pie-box"><canvas id="pie-canvas" width="56" height="56"></canvas>0.${tenth}</span>`;
      legendEl.innerHTML = html;
      const pc = document.getElementById("pie-canvas");
      if (pc) drawPie(pc.getContext("2d"), 28, 28, 25, tenth);
    }
  }

  if (window.ResizeObserver) new ResizeObserver(() => drawViz(lastN, lastTenth)).observe(vizWrap);
  else window.addEventListener("resize", () => drawViz(lastN, lastTenth));

  // ===== 問題モード =====
  let mode = "basic";
  try { if (localStorage.getItem("soroban-mode") === "quiz") mode = "quiz"; } catch (_) {}
  const SET_SIZE = 5, TEST_SIZE = 10, SETS_FOR_TEST = 10;
  const TYPES = [
    { k: "put", name: "かずをおく", short: "かずをおく" },
    { k: "add", name: "たしざん", short: "たしざん" },
    { k: "sub", name: "ひきざん", short: "ひきざん" },
    { k: "addsub", name: "たしざん・ひきざん", short: "たし・ひき" },
    { k: "mul", name: "かけざん", short: "かけざん" },
    { k: "div", name: "わりざん", short: "わりざん" },
    { k: "muldiv", name: "かけざん・わりざん", short: "かけ・わり" },
    { k: "all", name: "ぜんぶ まぜる", short: "ぜんぶ" }
  ];
  const TYPE = Object.fromEntries(TYPES.map(t => [t.k, t]));
  // レベルごとに使う整数のけた数（設定より少なければ自動でふやす）
  //   掛け算：答えのけた＋1　割り算：割られる数のけた＋2（答えを左に立てる分）
  const NEED = {
    add: [2, 2, 2, 3, 5], sub: [2, 2, 2, 2, 4], addsub: [2, 2, 2, 3, 5],
    mul: [3, 4, 5, 5, 6], div: [4, 4, 5, 6, 7], muldiv: [4, 4, 5, 6, 7], all: [4, 4, 5, 6, 7]
  };
  // しんきゅうテストの 1もんあたりの じかん（びょう）
  const SEC = {
    add: [10, 12, 15, 20, 30], sub: [10, 12, 15, 20, 30], addsub: [10, 12, 15, 20, 30],
    mul: [10, 20, 30, 40, 60], div: [12, 25, 35, 50, 70]
  };

  // --- すすみぐあい ---
  let progress = { unlock: {}, sets: {} };
  try {
    const p = JSON.parse(localStorage.getItem("soroban-progress") || "null");
    if (p && typeof p.unlock === "object" && typeof p.sets === "object") progress = p;
  } catch (_) {}
  const saveProgress = () => { try { localStorage.setItem("soroban-progress", JSON.stringify(progress)); } catch (_) {} };
  let noLock = false;
  try { noLock = localStorage.getItem("soroban-nolock") === "on"; } catch (_) {}
  const unlockedOf = k => Math.min(5, Math.max(1, progress.unlock[k] || 1));
  const isOpen = (k, L) => noLock || L <= unlockedOf(k);
  const setsOf = (k, L) => progress.sets[`${k}-${L}`] || 0;
  const testReady = k => { const u = unlockedOf(k); return u < 5 && setsOf(k, u) >= SETS_FOR_TEST; };

  let quizType = "put", quizLevel = 1;
  try {
    const sel = JSON.parse(localStorage.getItem("soroban-quizsel") || "null");
    if (sel && TYPE[sel.t]) { quizType = sel.t; quizLevel = Math.min(5, Math.max(1, sel.l | 0)); }
  } catch (_) {}
  if (!isOpen(quizType, quizLevel)) quizLevel = unlockedOf(quizType);
  const saveSel = () => { try { localStorage.setItem("soroban-quizsel", JSON.stringify({ t: quizType, l: quizLevel })); } catch (_) {} };

  function boardSize() {
    if (mode === "quiz" && quizType !== "put") {
      return { i: Math.min(INT_MAX, Math.max(intDigits, NEED[quizType][quizLevel - 1])), d: 0 };
    }
    return { i: intDigits, d: decDigits };
  }

  const quiz = {
    q: null, lastText: "", count: 0, total: SET_SIZE, elapsed: 0, qStart: 0, solved: false, finished: false,
    hold: null, ticker: null, test: false, testQs: [], limit: 0, failed: false
  };
  const quizBar = $("quiz-bar"), vizSection = $("viz");
  const qNum = $("q-number"), qCount = $("q-count"), qTime = $("q-time"), qPick = $("q-pick");
  const rand = n => Math.floor(Math.random() * n);
  const rnd = (a, b) => a + rand(Math.max(0, b - a + 1));
  const nd = n => rnd(10 ** (n - 1), 10 ** n - 1);                       // n けたの数
  const nz = n => { let x; do { x = nd(n); } while (x % 10 === 0); return x; };   // 1の位が0でない n けた
  const fmtTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const fmtTimeJa = ms => { const s = Math.round(ms / 1000), m = Math.floor(s / 60); return (m ? `${m}ふん` : "") + (s % 60 || !m ? `${s % 60}びょう` : ""); };

  // --- そろばんで たし・ひき するときに つかう わざ ---
  //   direct:そのまま  five:5の合成・分解  ten:10の合成・分解（くりあがり・くりさがり）
  //   combo:5と10の合わせわざ  chain:くりあがり・くりさがりが つづく
  const beadsOf = v => [v >= 5 ? 1 : 0, v % 5];
  function addAt(b, p, d, t, carry) {
    const v = b[p] || 0;
    if (v + d <= 9) {
      const [h, n] = beadsOf(v), [dh, dn] = beadsOf(d);
      t.add(n + dn <= 4 && h + dh <= 1 ? "direct" : "five");
      b[p] = v + d;
    } else {
      const c = 10 - d, [h, n] = beadsOf(v), [ch, cn] = beadsOf(c);
      t.add(n >= cn && h >= ch ? "ten" : "combo");
      if (carry) t.add("chain");
      b[p] = v - c;
      addAt(b, p + 1, 1, t, true);
    }
  }
  function subAt(b, p, d, t, borrow) {
    const v = b[p] || 0;
    if (v >= d) {
      const [h, n] = beadsOf(v), [dh, dn] = beadsOf(d);
      t.add(n >= dn && h >= dh ? "direct" : "five");
      b[p] = v - d;
    } else {
      const c = 10 - d, [h, n] = beadsOf(v), [ch, cn] = beadsOf(c);
      t.add(n + cn <= 4 && h + ch <= 1 ? "ten" : "combo");
      if (borrow) t.add("chain");
      b[p] = v + c;
      if (p > 40) return;
      subAt(b, p + 1, 1, t, true);
    }
  }
  const digitsLE = x => String(x).split("").reverse().map(Number);
  // 最初の数をおいてから、つぎつぎに ±x を 上のけたから 入れていく
  function techniques(start, terms) {
    const b = digitsLE(start), t = new Set();
    for (const x of terms) {
      const xd = digitsLE(Math.abs(x));
      for (let p = xd.length - 1; p >= 0; p--) if (xd[p]) (x > 0 ? addAt : subAt)(b, p, xd[p], t, false);
    }
    return t;
  }
  // 9や0が多い数（くりあがり・くりさがりが つづく問題用）
  function biased(n, dig) {
    let s = String(rnd(1, 9));
    for (let k = 1; k < n; k++) s += Math.random() < 0.55 ? dig : rand(10);
    return +s;
  }
  // レベルごとの出し方：make で数を作り、ok で使うわざを確かめる
  function planAS(op, L) {
    const r = Math.random(), coin = Math.random() < 0.5;
    const has = x => t => t.has(x);
    const none = (...xs) => t => xs.every(x => !t.has(x));
    if (op === "addsub") {
      if (L >= 4 && r < 0.5) {   // 3口（25 ＋ 13 − 17 など）
        const big = L === 5;
        const n = () => (big ? nd(rnd(2, 3)) : (Math.random() < 0.75 ? nd(2) : rnd(2, 9)));
        return {
          make: () => { const s = coin ? [1, -1] : [-1, 1]; return [big ? nd(3) : nd(2), s[0] * n(), s[1] * n()]; },
          ok: big ? has("ten") : () => true
        };
      }
      return planAS(coin ? "add" : "sub", L);
    }
    if (op === "add") {
      if (L === 1) return { make: () => [rnd(1, 8), rnd(1, 8)], ok: (t, v) => v <= 9 && none("five", "ten", "combo")(t) };
      if (L === 2) { const w = Math.random() < 0.8; return { make: () => [rnd(1, 8), rnd(1, 8)], ok: (t, v) => v <= 9 && (!w || t.has("five")) }; }
      if (L === 3) { const w = Math.random() < 0.8; return { make: () => [rnd(1, 9), rnd(1, 9)], ok: (t, v) => !t.has("combo") && (w ? t.has("ten") : v <= 9) }; }
      if (L === 4) {
        if (r < 0.3) return { make: () => [rnd(1, 9), rnd(1, 9)], ok: has("combo") };
        const w = Math.random() < 0.6;
        return { make: () => [nd(2), coin ? rnd(1, 9) : nd(2)], ok: t => (w ? t.has("combo") : t.has("ten")) };
      }
      if (r < 0.25) return { make: () => [biased(rnd(3, 4), 9), nd(rnd(1, 3))], ok: has("chain") };
      if (r < 0.6) return { make: () => [nd(rnd(3, 4)), nd(rnd(2, 4))], ok: has("ten") };
      return { make: () => [nd(rnd(2, 3)), nd(rnd(2, 3)), nd(rnd(2, 3))], ok: has("ten") };
    }
    // ひきざん
    const one = () => { const a = rnd(2, 9); return [a, -rnd(1, a - 1)]; };
    const teen = () => { const a = rnd(11, 18); return [a, -rnd(a - 9, 9)]; };
    if (L === 1) return { make: one, ok: none("five", "ten", "combo") };
    if (L === 2) { const w = Math.random() < 0.8; return { make: one, ok: t => !w || t.has("five") }; }
    if (L === 3) return Math.random() < 0.8 ? { make: teen, ok: t => t.has("ten") && !t.has("combo") } : planAS("sub", 2);
    if (L === 4) {
      if (r < 0.3) return { make: teen, ok: has("combo") };
      const w = Math.random() < 0.6;
      return { make: () => { const a = nd(2); return [a, -(coin ? rnd(1, 9) : rnd(10, a - 1))]; }, ok: t => (w ? t.has("combo") : t.has("ten")) };
    }
    if (r < 0.25) return { make: () => [biased(rnd(3, 4), 0), -nd(rnd(1, 3))], ok: has("chain") };
    if (r < 0.6) return { make: () => { const a = nd(rnd(3, 4)); return [a, -rnd(10, a - 1)]; }, ok: has("ten") };
    return { make: () => [nd(3), -nd(2), -nd(2)], ok: has("ten") };
  }
  function genAS(op, L) {
    for (let round = 0; round < 4; round++) {
      const plan = planAS(op, L);
      for (let i = 0; i < 500; i++) {
        const terms = plan.make();
        let v = terms[0], bad = false;
        for (const x of terms.slice(1)) { if (!x) bad = true; v += x; if (v < 0) bad = true; }
        if (bad || v <= 0) continue;
        const t = techniques(terms[0], terms.slice(1));
        if (!plan.ok(t, v)) continue;
        const ops = new Set(terms.slice(1).map(x => (x > 0 ? "add" : "sub")));
        return {
          op: ops.size > 1 ? "addsub" : [...ops][0], loose: false, answer: v, terms,
          text: terms[0] + terms.slice(1).map(x => ` ${x > 0 ? "＋" : "−"} ${Math.abs(x)}`).join("")
        };
      }
    }
    return { op: "add", loose: false, answer: 3, terms: [1, 2], text: "1 ＋ 2" };
  }
  function genMul(L) {
    const [da, db] = [[1, 1], [2, 1], [3, 1], [2, 2], [3, 2]][L - 1];
    const a = da === 1 ? rnd(2, 9) : nz(da), b = db === 1 ? rnd(2, 9) : nz(db);
    return { op: "mul", loose: true, answer: a * b, text: `${a} × ${b}` };
  }
  // わりざんは すべて わりきれる問題
  function genDiv(L) {
    let b = 2, q = 2;
    for (let i = 0; i < 100; i++) {
      if (L === 1) { b = rnd(2, 9); q = rnd(2, 9); }
      else {
        b = L <= 3 ? rnd(2, 9) : nz(2);
        const [lo, hi] = [[10, 99], [100, 999], [100, 9999], [1000, 99999]][L - 2];
        q = rnd(Math.max(2, Math.ceil(lo / b)), Math.floor(hi / b));
      }
      if (q % 10 !== 0 || Math.random() < 0.25) break;
    }
    return { op: "div", loose: true, answer: q, text: `${b * q} ÷ ${b}` };
  }
  // かずをおく：いろいろな大きさ（まず桁数を選んでからその桁の数を作る）
  function genPut() {
    for (let tries = 0; tries < 50; tries++) {
      const k = 1 + rand(intDigits);
      const I = k === 1 ? rand(10) : 10 ** (k - 1) + rand(9 * 10 ** (k - 1));
      let decs = Array.from({ length: decDigits }, () => rand(10));
      if (decDigits && Math.random() < 0.4) decs = decs.map(() => 0);   // 小数なしの問題もまぜる
      const d = decs.slice();
      while (d.length && d[d.length - 1] === 0) d.pop();
      const str = String(I) + (d.length ? "." + d.join("") : "");
      if ((I === 0 && !d.length) || str === quiz.lastText) continue;
      quiz.lastText = str;
      return { op: "put", text: str, I, decs };
    }
    return { op: "put", text: "1", I: 1, decs: [] };
  }
  const putDigit = (q, p) => (p >= 0 ? Math.floor(q.I / 10 ** p) % 10 : (q.decs[-p - 1] || 0));
  function genOne(type, L) {
    let op = type;
    if (type === "muldiv") op = Math.random() < 0.5 ? "mul" : "div";
    if (type === "all") op = pick(["add", "sub", "mul", "div"]);
    if (op === "mul") return genMul(L);
    if (op === "div") return genDiv(L);
    return genAS(op, L);
  }
  function genProblem(type, L) {
    let p = null;
    for (let i = 0; i < 20; i++) { p = genOne(type, L); if (p.text !== quiz.lastText) break; }
    quiz.lastText = p.text;
    return p;
  }
  const secOf = q => (SEC[q.op] || SEC.add)[quizLevel - 1];

  // --- 出題と答えあわせ ---
  let lastShown = "";
  function fitQ() {
    qNum.style.fontSize = "";
    const box = qNum.firstElementChild;
    if (!box || !qNum.clientWidth) return;
    let fs = parseFloat(getComputedStyle(qNum).fontSize) || 40;
    for (let k = 0; k < 24 && fs > 12 &&
      (box.offsetWidth > qNum.clientWidth - 4 || box.offsetHeight > qNum.clientHeight - 10); k++) {
      fs *= 0.92;
      qNum.style.fontSize = fs + "px";
    }
  }
  // 問題の書き方：たし・ひきは本と同じ たて書き、かけ・わりは よこ書き
  function problemHTML(q, showAns) {
    const ans = showAns ? String(q.answer) : "";
    if (q.terms) {
      const rows = q.terms.map(x => `<span class="mt-row">${x < 0 ? "−" : ""}${Math.abs(x)}</span>`).join("");
      return `<div class="mitori">${rows}<span class="mt-line"></span><span class="ans-box">${ans}</span></div>`;
    }
    if (q.op === "put") return `<div class="q-col"><span class="q-expr">${q.text}</span></div>`;
    return `<div class="q-col"><span class="q-expr">${q.text}</span><span class="q-eq">＝<span class="ans-box">${ans}</span></span></div>`;
  }
  window.addEventListener("resize", () => { if (mode === "quiz") fitQ(); });
  function updateBar() {
    const q = quiz.q;
    const showAns = q && quiz.solved && !quiz.failed && q.op !== "put";
    const key = q ? `${q.text}|${showAns ? 1 : 0}` : "";
    if (key !== lastShown) {
      lastShown = key;
      qNum.innerHTML = q ? problemHTML(q, showAns) : "";
      qNum.dataset.text = q ? q.text : "";
      qNum.setAttribute("aria-label", q ? (showAns ? `${q.text} ＝ ${q.answer}` : q.text) : "");
      fitQ();
    }
    qCount.textContent = `${Math.min(quiz.count + (quiz.solved ? 0 : 1), quiz.total)} / ${quiz.total}もん`;
    const used = quiz.elapsed + (quiz.solved ? 0 : performance.now() - quiz.qStart);
    if (quiz.test) {
      const left = Math.max(0, quiz.limit - used);
      qTime.textContent = `のこり ${fmtTime(left + 999)}`;
      qTime.classList.toggle("warn", left < quiz.limit * 0.2);
      if (left <= 0 && !quiz.solved) failTest();
    } else {
      qTime.textContent = fmtTime(used);
      qTime.classList.remove("warn");
    }
    qPick.textContent = quiz.test ? `テスト Lv${quizLevel}` : TYPE[quizType].short + (quizType === "put" ? "" : ` Lv${quizLevel}`);
  }
  function newQuestion() {
    clearTimeout(quiz.hold); quiz.hold = null;
    quiz.q = quiz.test ? quiz.testQs[quiz.count] : (quizType === "put" ? genPut() : genProblem(quizType, quizLevel));
    quiz.solved = false;
    values.clear();
    build();
    quiz.qStart = performance.now();
    updateBar();
  }
  function startSet() {
    quiz.test = false; quiz.failed = false; quiz.total = SET_SIZE;
    quiz.count = 0; quiz.elapsed = 0; quiz.finished = false;
    newQuestion();
  }
  function prepareTest() {
    const qs = [];
    for (let k = 0; k < TEST_SIZE; k++) qs.push(genProblem(quizType, quizLevel));
    return { qs, limit: qs.reduce((s, q) => s + secOf(q), 0) * 1000 };
  }
  function startTest(p) {
    quiz.test = true; quiz.failed = false; quiz.total = TEST_SIZE;
    quiz.testQs = p.qs; quiz.limit = p.limit;
    quiz.count = 0; quiz.elapsed = 0; quiz.finished = false;
    newQuestion();
  }
  // 足し算・引き算は位置もふくめてぴったり。掛け算・割り算は答えのならびが合っていれば正解（定位のずれはゆるす）
  function isCorrect() {
    const q = quiz.q;
    if (!q) return false;
    if (q.op === "put") return places.every(p => { const s = getVal(p); return s.h * 5 + s.n === putDigit(q, p); });
    const v = places.map(p => { const s = getVal(p); return s.h * 5 + s.n; });
    if (!q.loose) {
      let N = 0;
      places.forEach((p, i) => { N += v[i] * 10 ** p; });
      return N === q.answer;
    }
    const pat = v.join("").replace(/^0+/, "").replace(/0+$/, "");
    return pat !== "" && pat === String(q.answer).replace(/0+$/, "");
  }
  // そろえたら少しだけ待ってから正解にする（通り過ぎただけのときは数えない）
  function checkQuiz() {
    if (mode !== "quiz" || quiz.solved || !quiz.q) return;
    if (isCorrect()) {

  }
  function onSolved() {

    quiz.elapsed += performance.now() - quiz.qStart;
    quiz.count++;

  }
  function finishSet() {
    let note = "";
    if (quizType !== "put") {
      const key = `${quizType}-${quizLevel}`;
      progress.sets[key] = (progress.sets[key] || 0) + 1;
      saveProgress();
      const u = unlockedOf(quizType), s = progress.sets[key];
      if (quizLevel === u && u < 5) {
        note = s >= SETS_FOR_TEST ? "しんきゅうテストに ちょうせん できるよ！" : `しんきゅうテストまで あと ${SETS_FOR_TEST - s}セット`;
      }

  // --- しんきゅうテストの画面 ---

  function showTestSheet(kind) {

    if (kind === "intro") {
      prepared = prepareTest();
      $("test-title").textContent = "しんきゅうテスト";
      $("test-msg").textContent = `${name}　レベル${quizLevel} → レベル${quizLevel + 1}\n${TEST_SIZE}もんを ${fmtTimeJa(prepared.limit)}いないに\nぜんぶ とけたら ごうかく！`;
      $("test-go").textContent = "スタート";
      $("test-cancel").textContent = "やめる";
    } else {
      $("test-title").textContent = "じかんぎれ…";
      $("test-msg").textContent = `${TEST_SIZE}もんちゅう ${quiz.count}もん できたよ。\nもういちど ちょうせん してみよう！`;
      $("test-go").textContent = "もういちど";

  $("test-go").addEventListener("click", () => {

  // --- もんだいを えらぶ画面 ---
  const pickerEl = $("picker");
  const LOCK = `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="2" fill="currentColor"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`;
  function renderPicker() {
    $("picker-list").innerHTML = TYPES.map(t => {
      if (t.k === "put") {
        return `<div class="p-row"><div class="p-name">${t.name}</div><div class="p-levels">` +
          `<button type="button" data-t="put" data-l="1" aria-pressed="${quizType === "put"}">はじめる</button></div>` +
          `<div class="p-status">すうじを みて そろばんに おく</div></div>`;

          ` aria-label="レベル${L}${open ? "" : "（まだ ひらいていない）"}">${open ? "" : LOCK}Lv${L}</button>`;
      }).join("");

      if (u >= 5) st = `<span class="done">ぜんぶ ひらいたよ！</span>`;

      else {
        const s = setsOf(t.k, u);
        st = `<span class="prog"><span class="bar"><i style="width:${(s * 100) / SETS_FOR_TEST}%"></i></span>Lv${u}の シール ${s}/${SETS_FOR_TEST}</span>`;
      }
